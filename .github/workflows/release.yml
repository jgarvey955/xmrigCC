name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 3.5.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake binutils build-essential cmake libtool patch perl python3 wget

      - name: Build static CPU binaries
        env:
          BUILD_DIR: ${{ github.workspace }}/build-release
        run: ./build-static.sh

      - name: Package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          package="xmrigCC-${RELEASE_VERSION}-linux-${TARGET_ARCH}"
          mkdir -p "staging/${package}" dist
          cp build-release/xmrigMiner build-release/xmrigDaemon build-release/xmrigServer "staging/${package}/"
          cp README.md LICENSE index.html src/config.json "staging/${package}/"
          cp config-zecnero-*.json "staging/${package}/"
          {
            printf 'Project: xmrigCC\n'
            printf 'Version: %s\n' "$RELEASE_VERSION"
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Platform: Linux static %s\n' "$TARGET_ARCH"
            printf 'TLS: enabled\nGPU backends: disabled\n'
          } > "staging/${package}/BUILDINFO.txt"
          tar -C staging -czf "dist/${package}.tar.gz" "$package"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install automake libtool wget

      - name: Build static dependencies
        run: |
          export JOBS="$(sysctl -n hw.logicalcpu)"
          scripts/build_deps.sh

      - name: Build CPU binaries
        run: |
          cmake -S . -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DXMRIG_DEPS="$PWD/scripts/deps" \
            -DBUILD_STATIC=OFF \
            -DWITH_TLS=ON \
            -DWITH_HWLOC=ON \
            -DWITH_ZLIB=ON \
            -DWITH_CC_CLIENT=ON \
            -DWITH_CC_SERVER=ON \
            -DWITH_OPENCL=OFF \
            -DWITH_CUDA=OFF
          cmake --build build-release --parallel "$(sysctl -n hw.logicalcpu)"
          build-release/xmrigMiner --version

      - name: Package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          package="xmrigCC-${RELEASE_VERSION}-macos-${TARGET_ARCH}"
          mkdir -p "staging/${package}" dist
          cp build-release/xmrigMiner build-release/xmrigDaemon build-release/xmrigServer "staging/${package}/"
          cp README.md LICENSE index.html src/config.json "staging/${package}/"
          cp config-zecnero-*.json "staging/${package}/"
          {
            printf 'Project: xmrigCC\n'
            printf 'Version: %s\n' "$RELEASE_VERSION"
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Platform: macOS %s\n' "$TARGET_ARCH"
            printf 'TLS: enabled\nGPU backends: disabled\nCode signing: unsigned\n'
          } > "staging/${package}/BUILDINFO.txt"
          tar -C staging -czf "dist/${package}.tar.gz" "$package"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install dependency build tools
        shell: pwsh
        run: choco install strawberryperl nasm -y --no-progress

      - name: Build static dependencies
        shell: pwsh
        run: |
          & .\scripts\setup_windows_static_deps.ps1 `
            -Prefix "$env:RUNNER_TEMP\xmrigcc-deps" `
            -LibuvVersion "1.53.0" `
            -HwlocVersion "2.15.0" `
            -OpenSSLVersion "4.0.3" `
            -ZlibVersion "1.3.2"

      - name: Build static CPU binaries
        shell: pwsh
        run: |
          & .\scripts\build_windows_static.ps1 `
            -SourceDir "$env:GITHUB_WORKSPACE" `
            -BuildDir "$env:GITHUB_WORKSPACE\build-release" `
            -DepsDir "$env:RUNNER_TEMP\xmrigcc-deps"
          & .\build-release\xmrigMiner.exe --version

      - name: Package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $package = "xmrigCC-$env:RELEASE_VERSION-windows-x64"
          $packageDir = Join-Path "staging" $package
          New-Item -ItemType Directory -Force $packageDir, "dist" | Out-Null
          Copy-Item "build-release\xmrigMiner.exe", "build-release\xmrigDaemon.exe", "build-release\xmrigServer.exe" $packageDir
          Copy-Item "README.md", "LICENSE", "index.html", "src\config.json" $packageDir
          Copy-Item "config-zecnero-*.json" $packageDir
          @(
            "Project: xmrigCC"
            "Version: $env:RELEASE_VERSION"
            "Commit: $env:GITHUB_SHA"
            "Platform: Windows x64"
            "TLS: enabled"
            "GPU backends: disabled"
            "Code signing: unsigned"
          ) | Set-Content -Encoding ASCII (Join-Path $packageDir "BUILDINFO.txt")
          Compress-Archive -Path $packageDir -DestinationPath "dist\$package.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums and release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cd ..
          printf 'xmrigCC %s\n' "$RELEASE_VERSION" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" dist/* \
            --target "$GITHUB_SHA" \
            --title "xmrigCC ${RELEASE_VERSION}" \
            --notes-file release-notes.md
